<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    .status {
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 15px;
    }
    button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    button:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>
  <h3>AdBlocker</h3>
  <div class="status">Korumalar Aktif 🛡️</div>
  <button id="toggleBtn">Eklentiyi Yenile</button>
  <script src="popup.js"></script>
</body>
</html>
